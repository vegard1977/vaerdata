<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Techno Rock Flash Master</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;500;700;900&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0a0908;
    --surface: #111110;
    --border: #2a2520;
    --text: #f0e8d8;
    --text-dim: #6a6050;
    --gold: #d4af37;
    --gold-bright: #ffd700;
    --gold-glow: rgba(212, 175, 55, 0.3);
    --gold-dim: rgba(212, 175, 55, 0.08);
    --accent: #d4af37;
    --accent-glow: rgba(212, 175, 55, 0.35);
    --beat-active: #d4af37;
    --beat-inactive: #1a1815;
    --chord-active: #d4af37;
    --chord-hold: #c9a84c;
    --chord-dim: #1a1810;
    --chord-glow: rgba(212, 175, 55, 0.25);
    --upbeat: #e8c84c;
    --upbeat-glow: rgba(232, 200, 76, 0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(212, 175, 55, 0.02) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 100px, rgba(212, 175, 55, 0.008) 100px, rgba(212, 175, 55, 0.008) 101px);
    pointer-events: none; z-index: 0;
  }

  .container { position: relative; z-index: 1; width: 100%; max-width: 820px; }

  .header { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 24px; position: relative; }
  .guitar-svg { width: 80px; height: auto; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.2)); }
  .guitar-left { transform: rotate(-25deg); margin-right: -8px; margin-top: 10px; }
  .guitar-right { transform: rotate(25deg) scaleX(-1); margin-left: -8px; margin-top: 10px; }
  .title-block { text-align: center; padding: 0 12px; }
  .title-main {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem; letter-spacing: 0.12em;
    color: var(--gold-bright); text-shadow: 0 0 20px rgba(212,175,55,0.4), 0 0 40px rgba(212,175,55,0.15), 0 2px 0 #8a7020;
    line-height: 1; text-transform: uppercase;
  }
  .title-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; letter-spacing: 0.4em; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }
  .gold-line { width: 100%; height: 1px; background: linear-gradient(90deg, transparent 0%, var(--gold) 30%, var(--gold) 70%, transparent 100%); margin-bottom: 20px; opacity: 0.4; }

  /* Countdown overlay */
  .countdown-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 9, 8, 0.85); display: flex; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .countdown-overlay.active { opacity: 1; pointer-events: auto; }
  .countdown-number {
    font-family: 'Bebas Neue', sans-serif; font-size: 12rem; color: var(--gold-bright);
    text-shadow: 0 0 40px rgba(212,175,55,0.5), 0 0 80px rgba(212,175,55,0.2);
    animation: countPulse 0.8s ease-out; line-height: 1;
  }
  @keyframes countPulse { 0% { transform: scale(1.3); opacity: 0.3; } 30% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }

  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; transition: border-color 0.15s, box-shadow 0.15s; }
  .bar.active { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-dim), inset 0 0 20px var(--gold-dim); }
  .bar-header { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 12px; }

  .chord-row { display: grid; gap: 6px; margin-bottom: 10px; }
  .chord-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .chord-row.cols-5 { grid-template-columns: repeat(4, 1fr) 0.7fr; }

  .chord-slot {
    height: 42px; display: flex; align-items: center; justify-content: center; border-radius: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.95rem;
    color: var(--text-dim); background: var(--chord-dim); border: 1px solid transparent; transition: all 0.1s; user-select: none;
  }
  .chord-slot.upbeat-slot { font-size: 0.75rem; background: #151210; border: 1px dashed #3a3020; }
  .chord-slot.chord-active { background: var(--gold); color: #0a0908; box-shadow: 0 0 16px var(--gold-glow); transform: scale(1.05); border-color: var(--gold-bright); }
  .chord-slot.chord-hold { background: rgba(212,175,55,0.1); color: var(--gold); border: 1px solid rgba(212,175,55,0.3); }
  .chord-slot.upbeat-active { background: var(--upbeat); color: #0a0908; box-shadow: 0 0 16px var(--upbeat-glow); transform: scale(1.05); border-style: solid; border-color: var(--gold-bright); }

  .beat-row { display: grid; gap: 6px; }
  .beat-row.cols-4 { grid-template-columns: repeat(4, 1fr); }
  .beat-row.cols-5 { grid-template-columns: repeat(4, 1fr) 0.7fr; }
  .beat {
    height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 5px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.85rem;
    color: var(--text-dim); background: var(--beat-inactive); border: 1px solid transparent; transition: all 0.08s;
  }
  .beat.upbeat-beat { font-size: 0.7rem; background: #121010; }
  .beat.beat-active { background: var(--gold); color: #0a0908; box-shadow: 0 0 14px var(--accent-glow); transform: scale(1.08); border-color: var(--gold-bright); }
  .beat.upbeat-beat.beat-active { background: var(--upbeat); box-shadow: 0 0 14px var(--upbeat-glow); }

  .controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em;
    text-transform: uppercase; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text); padding: 10px 24px; cursor: pointer; transition: all 0.15s;
  }
  .btn:hover { border-color: var(--gold); box-shadow: 0 0 12px rgba(212,175,55,0.15); color: var(--gold-bright); }
  .btn.playing { background: var(--gold); color: #0a0908; border-color: var(--gold-bright); font-weight: 800; }
  .btn.stop-btn:hover { border-color: #aa3333; color: #ff6666; box-shadow: 0 0 12px rgba(170,51,51,0.15); }

  /* Sound mode toggle */
  .mode-toggle {
    display: flex; border: 1px solid var(--border); border-radius: 6px; overflow-y: auto;
  }
  .mode-btn {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.65rem; letter-spacing: 0.05em;
    text-transform: uppercase; background: var(--surface); color: var(--text-dim);
    padding: 10px 14px; cursor: pointer; border: none; transition: all 0.15s;
  }
  .mode-btn.active { background: var(--gold); color: #0a0908; }
  .mode-btn:hover:not(.active) { color: var(--gold); }

  .bpm-control {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px;
  }
  .bpm-label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
  .bpm-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--gold-bright); min-width: 45px; text-align: center; text-shadow: 0 0 10px rgba(212,175,55,0.3); }
  .bpm-slider { -webkit-appearance: none; appearance: none; width: 100px; height: 3px; background: var(--border); border-radius: 2px; outline: none; }
  .bpm-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); cursor: pointer; box-shadow: 0 0 8px var(--gold-glow); }
  .bpm-slider::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); cursor: pointer; border: none; }

  /* Volume controls */
  .vol-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; }
  .vol-control {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px;
  }
  .vol-label { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .vol-slider { -webkit-appearance: none; appearance: none; width: 70px; height: 3px; background: var(--border); border-radius: 2px; outline: none; }
  .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); cursor: pointer; }
  .vol-slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); cursor: pointer; border: none; }

  .info { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.1em; }
  .flash-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; opacity: 0; }
  .flash-overlay.flash { opacity: 1; background: radial-gradient(circle at 50% 50%, rgba(212,175,55,0.06) 0%, transparent 70%); animation: flashOut 0.2s ease-out forwards; }
  .flash-overlay.flash-upbeat { opacity: 1; background: radial-gradient(circle at 50% 50%, rgba(232,200,76,0.05) 0%, transparent 70%); animation: flashOut 0.15s ease-out forwards; }
  @keyframes flashOut { 0% { opacity: 1; } 100% { opacity: 0; } }
  .version { position: fixed; bottom: 8px; right: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; color: var(--text-dim); opacity: 0.3; }
</style>
</head>

      <div class="title-main">Techno Rock<br>Flash Master</div>

    </div>

  <div class="bars" id="bars"></div>

  <div class="controls">
    <button class="btn" id="playBtn" onclick="togglePlay()">Play</button>
    <button class="btn stop-btn" onclick="stopPlay()">Stop</button>
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeClick" onclick="setMode('click')">Klikk</button>
      <button class="mode-btn" id="modeVoice" onclick="setMode('voice')">Stemme</button>
    </div>
    <div class="bpm-control">
      <span class="bpm-label">BPM</span>
      <input type="range" class="bpm-slider" id="bpmSlider" min="40" max="200" value="90" oninput="updateBpm(this.value)">

    </div>

    <div class="vol-control">
      <span class="vol-label">Klikk vol</span>

    </div>
    <div class="vol-control">
      <span class="vol-label">Stemme vol</span>
      <input type="range" class="vol-slider" id="volVoice" min="0" max="100" value="90" oninput="volVoiceVal=this.value/100">
    </div>

      <span class="vol-label">Upbeat vol</span>

<script>
// === v1.5 ===
// Changelog:
//   v1.0 - Initial 4-bar metronome
//   v1.1 - Upbeat &4 with ghost note sound
//   v1.2 - Black/gold theme, Les Paul SVGs
//   v1.5 - C moved to beat 1 in takt 2 (was beat 2)
//        - 3-2-1 countdown before start
//        - Separate volume controls (click/voice/upbeat)

// Preload audio buffers
const audioBuffers = {};
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function preloadSamples() {
  initAudio();
  for (const [key, dataUri] of Object.entries(SAMPLES)) {
    try {
      const resp = await fetch(dataUri);
      const buf = await resp.arrayBuffer();
      audioBuffers[key] = await audioCtx.decodeAudioData(buf);
    } catch(e) { console.warn('Failed to load:', key, e); }
  }
}

function playSample(key, volume) {
  if (!audioCtx || !audioBuffers[key]) return;
  const source = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  source.buffer = audioBuffers[key];
  gain.gain.value = volume;
  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();
}

let bpm = 90, isPlaying = false, seqIndex = 0, timeoutId = null;
let soundMode = 'click'; // 'click' or 'voice'
let volClickVal = 0.8, volVoiceVal = 0.9, volUpbeatVal = 0.7;
let samplesLoaded = false;

// === SYNTH SOUNDS ===
function playClick(isBeatOne) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.frequency.value = isBeatOne ? 1000 : 700;
  osc.type = 'sine';
  gain.gain.setValueAtTime(volClickVal * 0.5, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
  osc.start(now); osc.stop(now + 0.06);
}

function playUpbeatSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  // Sharp rimshot: high-pitched sine pop + bright noise crack
  // Layer 1: Sharp sine pop at 1800Hz - the "crack"
  const osc1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(1800, now);
  osc1.frequency.exponentialRampToValueAtTime(600, now + 0.02);
  g1.gain.setValueAtTime(volUpbeatVal * 0.7, now);
  g1.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
  osc1.connect(g1); g1.connect(audioCtx.destination);
  osc1.start(now); osc1.stop(now + 0.05);
  // Layer 2: Square wave bite for edge
  const osc2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(4000, now);
  osc2.frequency.exponentialRampToValueAtTime(1500, now + 0.01);
  g2.gain.setValueAtTime(volUpbeatVal * 0.25, now);
  g2.gain.exponentialRampToValueAtTime(0.001, now + 0.015);
  osc2.connect(g2); g2.connect(audioCtx.destination);
  osc2.start(now); osc2.stop(now + 0.02);
  // Layer 3: Short bright noise burst for "snap"
  const bufLen = audioCtx.sampleRate * 0.025;
  const buffer = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const hp = audioCtx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 3000; hp.Q.value = 1;
  const g3 = audioCtx.createGain();
  g3.gain.setValueAtTime(volUpbeatVal * 0.5, now);
  g3.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
  noise.connect(hp); hp.connect(g3); g3.connect(audioCtx.destination);
  noise.start(now); noise.stop(now + 0.025);
}

// === UI ===
function buildUI() {
  const container = document.getElementById('bars');
  container.innerHTML = '';
  barDisplay.forEach((bar, barIdx) => {
    const barEl = document.createElement('div');
    barEl.className = 'bar'; barEl.id = `bar-${barIdx}`;
    const colClass = bar.hasUpbeat ? 'cols-5' : 'cols-4';
    const beatLabels = bar.hasUpbeat ? ['1','2','3','4','&4'] : ['1','2','3','4'];
    let chordHTML = bar.slots.map((ch, si) => {
      const isUp = bar.hasUpbeat && si === 4;
      const cls = ['chord-slot', ch ? 'has-chord' : '', isUp ? 'upbeat-slot' : ''].filter(Boolean).join(' ');
      return `<div class="${cls}" id="chord-${barIdx}-${si}">${ch}</div>`;
    }).join('');
    let beatHTML = beatLabels.map((lbl, si) => {
      const isUp = bar.hasUpbeat && si === 4;
      const cls = ['beat', isUp ? 'upbeat-beat' : ''].filter(Boolean).join(' ');
      return `<div class="${cls}" id="beat-${barIdx}-${si}">${lbl}</div>`;
    }).join('');
    barEl.innerHTML = `<div class="bar-header">${bar.label}</div><div class="chord-row ${colClass}">${chordHTML}</div><div class="beat-row ${colClass}">${beatHTML}</div>`;
    container.appendChild(barEl);
  });
}

function getActiveChordAtSeq(idx) {
  for (let i = idx; i >= 0; i--) { if (sequence[i].chord !== null) return { seqIdx: i, bar: sequence[i].bar, slot: sequence[i].slot }; }
  for (let i = sequence.length - 1; i > idx; i--) { if (sequence[i].chord !== null) return { seqIdx: i, bar: sequence[i].bar, slot: sequence[i].slot }; }
  return null;
}

function updateDisplay() {
  document.querySelectorAll('.bar').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.beat').forEach(el => el.classList.remove('beat-active'));
  document.querySelectorAll('.chord-slot').forEach(el => el.classList.remove('chord-active', 'chord-hold', 'upbeat-active'));
  const ev = sequence[seqIndex];
  const barEl = document.getElementById(`bar-${ev.bar}`); if (barEl) barEl.classList.add('active');
  const beatEl = document.getElementById(`beat-${ev.bar}-${ev.slot}`); if (beatEl) beatEl.classList.add('beat-active');
  const active = getActiveChordAtSeq(seqIndex);
  if (active) {
    const chordEl = document.getElementById(`chord-${active.bar}-${active.slot}`);
    if (chordEl) {
      if (active.seqIdx === seqIndex) chordEl.classList.add(ev.isUpbeat ? 'upbeat-active' : 'chord-active');
      else chordEl.classList.add('chord-hold');
    }
  }
  const flash = document.getElementById('flash');
  flash.classList.remove('flash', 'flash-upbeat'); void flash.offsetWidth;
  if (ev.isUpbeat) flash.classList.add('flash-upbeat');
  else if (ev.slot === 0) flash.classList.add('flash');
}

function getNextDelay() {
  const msPerBeat = 60000 / bpm;
  const nextIdx = (seqIndex + 1) % sequence.length;
  if (sequence[nextIdx].isUpbeat) return msPerBeat / 2;
  if (sequence[seqIndex].isUpbeat) return msPerBeat / 2;
  return msPerBeat;
}

function tick() {
  const ev = sequence[seqIndex];
  if (ev.isUpbeat) {
    playUpbeatSound();
  } else if (soundMode === 'voice' && samplesLoaded && ev.beatNum >= 1) {
    playSample('count_' + ev.beatNum, volVoiceVal);
  } else {
    playClick(ev.slot === 0);
  }
  updateDisplay();
  const delay = getNextDelay();
  seqIndex = (seqIndex + 1) % sequence.length;
  if (isPlaying) timeoutId = setTimeout(tick, delay);
}

// === COUNTDOWN ===
async function doCountdown() {
  const overlay = document.getElementById('countdownOverlay');
  const numEl = document.getElementById('countdownNumber');
  overlay.classList.add('active');

  const msPerBeat = 60000 / bpm;

  for (let i = 3; i >= 1; i--) {
    numEl.textContent = i;
    numEl.style.animation = 'none'; void numEl.offsetWidth; numEl.style.animation = 'countPulse 0.8s ease-out';
    if (samplesLoaded) playSample('countdown_' + i, volVoiceVal);
    else playClick(true);
    await new Promise(r => setTimeout(r, msPerBeat));
  }

  overlay.classList.remove('active');
}

// === CONTROLS ===
async function togglePlay() {
  if (isPlaying) { pausePlay(); return; }
  initAudio();
  if (!samplesLoaded) {
    await preloadSamples();
    samplesLoaded = true;
  }
  await doCountdown();
  isPlaying = true;
  document.getElementById('playBtn').textContent = 'Pause';
  document.getElementById('playBtn').classList.add('playing');
  tick();
}

function pausePlay() {
  isPlaying = false; clearTimeout(timeoutId);
  document.getElementById('playBtn').textContent = 'Play';
  document.getElementById('playBtn').classList.remove('playing');
}

function stopPlay() {
  pausePlay(); seqIndex = 0;
  document.querySelectorAll('.bar').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.beat').forEach(el => el.classList.remove('beat-active'));
  document.querySelectorAll('.chord-slot').forEach(el => el.classList.remove('chord-active', 'chord-hold', 'upbeat-active'));
}

function updateBpm(val) { bpm = parseInt(val); document.getElementById('bpmDisplay').textContent = bpm; }

function setMode(mode) {
  soundMode = mode;
  document.getElementById('modeClick').classList.toggle('active', mode === 'click');
  document.getElementById('modeVoice').classList.toggle('active', mode === 'voice');
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'Escape') stopPlay();
});

buildUI();
</script>
